apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploytual-backend
  labels:
    app: deploytual
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deploytual
      tier: backend
  template:
    metadata:
      labels:
        app: deploytual
        tier: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/sangramghose/deploytual:latest
        ports:
        - containerPort: 8000
        env:
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: deploytual-secrets
              key: google-client-id
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: deploytual-secrets
              key: secret-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
