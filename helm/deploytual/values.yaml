# Default values for deploytual.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

backend:
  image:
    repository: ghcr.io/sangramghose/deploytual
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8000

frontend:
  enabled: true
  image:
    repository: nginx
    tag: alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  configMapName: deploytual-frontend-config   # must be created separately (see README)

secrets:
  googleClientId: ""    # base64 encoded value
  secretKey: ""         # base64 encoded value

ingress:
  enabled: false
  hosts:
    - host: deploytual.local
      paths:
        - path: /
          pathType: Prefix
